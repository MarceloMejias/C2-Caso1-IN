[project]
name = "c2-caso1-in"
version = "0.1.0"
description = "Certamen 2 - Inteligencia de Negocios (Caso 1: Mueblería Albarrán)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymssql>=2.2.8",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "ruff>=0.17.0",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Reglas relajadas para celdas interactivas de Jupyter
"*.ipynb" = ["E501", "F401", "W291", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty]
# Configuración del type checker ty de Astral
