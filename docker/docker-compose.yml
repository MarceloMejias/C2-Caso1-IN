services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_albarran
    # platform: linux/amd64 permite ejecutar SQL Server 2022 oficial en macOS Apple Silicon (ARM64)
    # mediante la emulación Rosetta 2 de Docker Desktop, garantizando 100% de compatibilidad con backups (.bak)
    platform: linux/amd64
    user: root
    env_file:
      - ../.env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD debe estar definida en el archivo .env}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Monta la carpeta de backups para que SQL Server pueda acceder directamente a Albarran.bak
      - ../database/backup:/var/opt/mssql/backup
      # Persistencia de los datos del motor
      - sqlserver_data:/var/opt/mssql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  sqlserver_data:
    driver: local
